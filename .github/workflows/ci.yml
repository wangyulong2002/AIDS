# =============================================================
# AIDS CI 门禁
#
# 设计见 docs/工程化门禁方案.md：
#   L1 pre-commit（本地，< 5s）—— 见 .pre-commit-config.yaml
#   L2 PR（本文件 lint / contract / invariants / typecheck，< 5min）
#   L3 merge 到 main（smoke，< 15min）
#
# 核心思想：约束产出（代码能不能过检查），而非约束输入（AI 读没读文档）。
#
# -------------------------------------------------------------
# 修复记录
#
# run #1（bb8b99a）：lint ✅ / contract ❌ / invariants ❌ / typecheck ❌
#   根因：CI 上从未把仓库根放进 Python 导入路径。本地能跑只是因为
#         cwd 恰好等于仓库根（sys.path[0] 为空串 = cwd）。
#   修复：全局 PYTHONPATH: ${{ github.workspace }}（v2）
#
# run #2（974041a）：lint ✅ / invariants ✅ / contract ❌ / typecheck ❌
#   lint、invariants 已转绿，PYTHONPATH 修复生效。
#
#   剩余问题 1 —— contract: `Initialize containers` 失败
#     根因：`--default-time-zone=+00:00` 是 MySQL 服务端参数，
#           不是 docker flag。GitHub Actions 把 services.<id>.options
#           的内容原样拼进 `docker create` 命令行
#           （见 actions/runner DockerCommandManager.cs），
#           docker 直接报 `unknown flag: --default-time-zone`，
#           容器根本创建不出来 → Initialize containers 失败。
#     修复：把 MySQL 参数挪到 `services.<id>.options` 之外的
#           image command 段（YAML 顶层 `services.mysql.command`），
#           让 runner 在 IMAGE 之后拼接这些参数。
#
#   剩余问题 2 —— typecheck: pyright 报 16 errors
#     根因 A（13 个）：`Could not resolve import "pydantic"/"pytest"/"hypothesis"`。
#           pyright 是 Node 程序，不读 pip 环境的 site-packages，
#           也不知道 CI 上仓库根在哪，必须显式告知依赖位置。
#     根因 B（3 个）：真实类型错误 `str | None` 赋给 `str`
#           （tests/conftest.py、tests/contract/_doc_parser.py）。
#           已改为窄化后的局部变量，代码本身修复。
#     修复：CI 用 venv + 生成 pyrightconfig.json，
#           `extraPaths` 显式指向 venv 的 site-packages。
#           本地实测 16 → 2 errors，13 个 import 错误全部消除。
#
# 为什么不用 pip install -e .：
#   本项目 hatchling 构建需联网拉构建依赖，多一个失败点。
#   PYTHONPATH + extraPaths 零额外依赖。
# -------------------------------------------------------------
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # 关键：让仓库根进入导入路径，`import app` / `tests.*` 才可用
  PYTHONPATH: ${{ github.workspace }}

jobs:
  # ---------------------------------------------------------------
  # L2-a 代码风格与静态检查
  # ---------------------------------------------------------------
  lint:
    name: Lint (ruff + 扫描器)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.8" "pydantic>=2.9"

      - name: ruff format 检查
        run: ruff format --check app tests

      - name: ruff lint
        run: ruff check app tests

      - name: 自检（确认 tests 包可导入）
        run: python -c "import tests.contract._doc_parser as p; print('parser ok:', p.SCHEMA_SQL.name)"

      - name: C4 错误码扫描（禁止硬编码错误码）
        run: python -m tests.contract.scan_error_codes app

      - name: C2 状态枚举扫描（禁止魔法数字）
        run: python -m tests.contract.scan_enum_magic_numbers app

  # ---------------------------------------------------------------
  # L2-b 契约测试 —— 本门禁的核心
  #
  # 必须跑在真实 MySQL 8 上：C1/C8 依赖 CHECK 约束、ngram 全文索引、
  # UNIQUE 语义，SQLite 测不出来。
  # ---------------------------------------------------------------
  contract:
    name: Contract (文档 ↔ 代码一致性)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aids_shop_test
          MYSQL_USER: aids
          MYSQL_PASSWORD: aids_pass
        ports:
          - 13306:3306
        # 注意：这里只能放 docker flag。
        # MySQL 自身的服务端参数（如 --default-time-zone）必须放在 command，
        # 否则 runner 会原样拼到 `docker create` 里导致 unknown flag。
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
        command: --default-time-zone=+00:00

    env:
      APP_ENV: test
      DATABASE_URL: mysql+asyncmy://aids:aids_pass@127.0.0.1:13306/aids_shop_test?charset=utf8mb4

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=8.3" "pydantic>=2.9" "hypothesis>=6.120"
          pip install "sqlalchemy>=2.0" "pymysql>=1.1"

      - name: 自检（确认 app 与 tests 均可导入）
        run: |
          python -c "import app; print('app ok:', app.__file__)"
          python -c "import tests.contract._doc_parser as p; print('parser ok:', p.SCHEMA_SQL.exists())"

      - name: 等待 MySQL 就绪
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 13306 -uaids -paids_pass --silent 2>/dev/null; then
              echo "MySQL 就绪"; exit 0
            fi
            echo "等待 MySQL... ($i)"; sleep 2
          done
          echo "::error::MySQL 未在 60s 内就绪"; exit 1

      - name: 载入 DDL（真实建表）
        run: |
          mysql -h 127.0.0.1 -P 13306 -uaids -paids_pass aids_shop_test \
            < docs/sql/schema.sql

      - name: C1/C2/C4/C7/C8 契约测试（静态层）
        run: pytest tests/contract -q -m contract

      - name: C1 契约测试（反射层，连真实库）
        run: pytest tests/contract -q -m requires_mysql

  # ---------------------------------------------------------------
  # L2-c 不变量测试 —— 库存/幂等/退款/IDOR/启动断言
  # ---------------------------------------------------------------
  invariants:
    name: Invariants (业务不变量)
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=8.3" "pydantic>=2.9" "hypothesis>=6.120"

      - name: 自检（确认 app 与 tests 均可导入）
        run: |
          python -c "import app; print('app ok')"
          python -c "import tests.invariants; print('tests.invariants ok')"

      - name: 库存/幂等/退款/优惠券不变量（含启动断言 S1）
        run: pytest tests/invariants -q -m invariant

  # ---------------------------------------------------------------
  # L2-d 类型检查（标准档：basic）
  #
  # 关键：pyright 是 Node 程序，不认识 pip 的 site-packages。
  #       必须把依赖路径写进 pyrightconfig.json 的 extraPaths，
  #       否则所有第三方 import 都会报 could not be resolved。
  # ---------------------------------------------------------------
  typecheck:
    name: Typecheck (pyright basic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install "pydantic>=2.9" "sqlalchemy>=2.0"
          pip install "pytest>=8.3" "hypothesis>=6.120"

      - name: 生成 pyright 配置（显式指定依赖路径）
        run: |
          python - <<'PY'
          import json
          import site

          paths = [p for p in site.getsitepackages() if p]
          try:
              paths.append(site.getusersitepackages())
          except Exception:
              pass

          cfg = {
              "include": ["app", "tests"],
              "exclude": ["**/node_modules", "deploy", "docs"],
              "pythonVersion": "3.11",
              "typeCheckingMode": "basic",
              "reportMissingImports": True,
              "reportMissingTypeStubs": False,
              "extraPaths": paths,
          }
          with open("pyrightconfig.json", "w", encoding="utf-8") as fh:
              json.dump(cfg, fh, indent=2, ensure_ascii=False)
          print("pyrightconfig.json:")
          print(json.dumps(cfg, indent=2, ensure_ascii=False))
          PY

      - name: 安装 pyright
        run: npm install -g pyright

      - name: pyright 检查（解析结果，有 error 才失败）
        run: |
          pyright --outputjson > pyright.json || true
          python - <<'PY'
          import json
          import sys

          try:
              data = json.load(open("pyright.json", encoding="utf-8"))
          except Exception as exc:
              print("pyright 未产出可解析结果:", exc)
              sys.exit(1)

          summary = data.get("summary", {})
          print("pyright summary:", summary)

          errors = [
              d for d in data.get("generalDiagnostics", [])
              if d.get("severity") == "error"
          ]
          for diag in errors:
              path = diag.get("file", "")
              line = diag.get("range", {}).get("start", {}).get("line", 0) + 1
              print(f"  ERROR {path}:{line} {diag.get('message')}")

          if errors:
              print(f"::error::pyright 发现 {len(errors)} 个类型错误")
              sys.exit(1)

          print("pyright 无类型错误")
          PY

  # ---------------------------------------------------------------
  # L3 冒烟：仅 main 分支
  #
  # 当前 0 业务代码，暂只校验 compose 可解析。
  # T1 起替换为真实链路：拉起最小档 → 登录 → 下单 → 支付回调。
  # ---------------------------------------------------------------
  smoke:
    name: Smoke (compose 最小档)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [lint, contract, invariants, typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: 校验 compose 配置可解析
        run: docker compose -f deploy/docker-compose.yml config > /dev/null

      - name: 提示（待 T1 接入真实冒烟链路）
        run: |
          echo "::notice::当前为 T0 阶段（0 业务代码），冒烟仅校验 compose 配置。"
          echo "::notice::T1 完成后应替换为：拉起最小档 → 登录 → 下单 → 支付回调。"

  # ---------------------------------------------------------------
  # 门禁汇总（供分支保护规则引用）
  # ---------------------------------------------------------------
  gate:
    name: 门禁汇总
    if: always()
    needs: [lint, contract, invariants, typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: 检查所有门禁任务
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          if echo "$results" | grep -qE '"(failure|cancelled)"'; then
            echo "::error::门禁未通过，禁止合并。"
            exit 1
          fi
          echo "✅ 全部门禁通过。"
