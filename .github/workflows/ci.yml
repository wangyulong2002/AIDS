# =============================================================
# AIDS CI 门禁
#
# 设计见 docs/工程化门禁方案.md：
#   L1 pre-commit（本地，< 5s）—— 见 .pre-commit-config.yaml
#   L2 PR（本文件 lint / contract / typecheck，< 5min）
#   L3 merge 到 main（smoke，< 15min）
#
# 核心思想：约束产出（代码能不能过检查），而非约束输入（AI 读没读文档）。
# =============================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------
  # L2-0 文档一致性门禁（TASKS DEP-05：必须是 CI 的**第一步**）
  #
  # 为什么排在 lint 之前：它拦的是"文档与代码已经互相矛盾"这类
  # 结构性漂移（表数/字段数/枚举组数/服务数/任务数/跨文档常量），
  # 一旦漂移，后面的测试即使全绿也没有意义。
  #
  # 纯标准库实现（argparse/re/pathlib），无需安装任何依赖——
  # 因此它不会因为依赖装不上而被跳过。历史教训：本脚本曾经**不在任何
  # 自动化里**，33 项检查只有在人记得手敲命令时才跑。
  # ---------------------------------------------------------------
  docs:
    name: Consistency (文档 35 项 + 依赖清单)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 文档一致性门禁
        run: python3 docs/tools/gen_data_dictionary.py --check -v

      - name: 依赖清单一致性（aids-*/requirements.txt ← pyproject.toml）
        run: python3 scripts/gen_requirements.py --check

      - name: 依赖快照一致性（constraints.txt 覆盖 pyproject 全部直接依赖）
        run: python3 scripts/gen_constraints.py --check

      - name: ORM 模型一致性（app/models ← docs/sql/schema.sql）
        # 纯标准库，与上面两条同属"单一来源 + 派生"的一致性门禁：
        # 模型是生成物，DDL 改了却忘了重跑生成器，症状是运行期 Unknown column。
        run: python3 scripts/gen_orm_models.py --check

  # ---------------------------------------------------------------
  # L2-a 代码风格与静态检查
  # ---------------------------------------------------------------
  lint:
    name: Lint (ruff + 扫描器)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        # 扫描器只用标准库（ast/re/pathlib），ruff 是唯一需要安装的——
        # 刻意保持"零项目依赖"，这样"装不上依赖"永远不是本 job 失败的原因。
        run: pip install -c constraints.txt "ruff>=0.8"

      - name: ruff format 检查
        # `app` 是共享契约层；`aids-*` 是服务包源码目录
        # （aids-backend/aids_backend 等）。曾经只写 `app tests`，
        # BE-01 新增的服务代码完全不在检查范围内。
        run: ruff format --check app tests aids-*

      - name: ruff lint
        run: ruff check app tests aids-*

      - name: C4 错误码扫描（禁止硬编码错误码）
        # 不传目录参数 = 使用 tests/contract/_targets.py 的默认扫描面
        # （共享层 + 全部服务包）。写死 `app` 会让新增服务静默漏检。
        run: python -m tests.contract.scan_error_codes

      - name: C2 状态枚举扫描（禁止魔法数字）
        run: python -m tests.contract.scan_enum_magic_numbers

  # ---------------------------------------------------------------
  # L2-b 契约测试 —— 本门禁的核心
  #
  # 必须跑在真实 MySQL 8 上：C1/C8 依赖 CHECK 约束、ngram 全文索引、
  # UNIQUE 语义，SQLite 测不出来。
  # ---------------------------------------------------------------
  contract:
    name: Contract (文档 ↔ 代码一致性)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aids_shop_test
          MYSQL_USER: aids
          MYSQL_PASSWORD: aids_pass
        ports:
          - 13306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --default-time-zone=+00:00

    env:
      APP_ENV: test
      DATABASE_URL: mysql+asyncmy://aids:aids_pass@127.0.0.1:13306/aids_shop_test?charset=utf8mb4

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        # 依赖清单只有 pyproject.toml 一处（含 pymysql —— 反射层测试要用它）。
        # 不在这里另写一份包名列表，避免"CI 装的和本地装的不一样"。
        run: pip install -c constraints.txt -e ".[dev]"

      - name: 载入 DDL（真实建表）
        # 为什么用 root 而不是应用账号 aids：
        #   schema.sql 含 CREATE DATABASE + USE，需要建库权限；服务容器的
        #   MYSQL_USER=aids 只被授予 MYSQL_DATABASE(aids_shop_test) 上的权限，
        #   建库直接 Access denied。用 root 执行，再把权限显式授给应用账号。
        #
        # 为什么用 sed 替换库名，而不是给 SQL 引入变量：
        #   schema.sql / seed.sql 里的库名是固定字面量 `aids_shop`。曾试过写成
        #   ${AIDS_MAIN_DB:-aids_shop}（像 shell 那样），实测 mysql 8.4.11 **不展开**：
        #   SHOW DATABASES 里出现字面名为 "${AIDS_MAIN_DB:-aids_shop}" 的库，38 张表
        #   全建了进去，且全程不报错。静默建错库比直接失败更难排查，故改回 sed。
        #   sed 只锚定反引号包裹的 `aids_shop`，不会误伤注释里出现的裸词 aids_shop。
        #
        # 为什么不能反过来"让 CI 也建 aids_shop"：
        #   启动断言 S1-d（app/core/config.py::assert_db_is_isolated）禁止 test 环境
        #   连库名含 aids_shop 的库；建得图省事，测试连的瞬间就被拒启。
        run: |
          set -euo pipefail

          # 1) 以 root 建库建表；库名 aids_shop -> aids_shop_test
          #    --default-character-set=utf8mb4：防止中文 COMMENT 在非 UTF8 连接下变问号
          sed 's/`aids_shop`/`aids_shop_test`/g' docs/sql/schema.sql \
            | mysql --default-character-set=utf8mb4 -h 127.0.0.1 -P 13306 -uroot -proot

          # 2) 授权给应用账号（否则后面用 aids 连接会 Access denied）
          mysql -h 127.0.0.1 -P 13306 -uroot -proot -e \
            "GRANT ALL PRIVILEGES ON \`aids_shop_test\`.* TO 'aids'@'%'; FLUSH PRIVILEGES;"

          # 3) 自检：表数必须为 38。这一步是"静默建错库"事故的直接产物——
          #    没有它，建到别的库上时后续测试会以"表不存在"的面目出现，误导排查方向。
          n=$(mysql -h 127.0.0.1 -P 13306 -uroot -proot -N -B -e \
            "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='aids_shop_test';")
          echo "aids_shop_test 表数 = $n"
          if [ "$n" != "38" ]; then
            echo "::error::期望 38 张表，实际 $n —— DDL 未完整导入。"
            exit 1
          fi
        continue-on-error: false

      - name: Alembic 迁移基建可加载（不需要 DB）
        # 验证 alembic.ini / env.py / 模型导入链是通的 —— 这类问题只在
        # 真正跑迁移时才暴露，而那时通常已经在部署窗口里了。
        run: alembic -c aids-backend/alembic.ini heads

      - name: C1/C2/C4/C7/C8 契约测试（静态层）
        # 用 `tests` 而非 `tests/contract`：BE-01 起的接口层契约测试在
        # tests/api/，同样带 contract 标记。按标记筛选比按目录筛选更耐用——
        # 新增测试目录时不会被漏掉。
        run: pytest tests -q -m contract

      - name: C1 契约测试（反射层，连真实库）
        run: pytest tests -q -m requires_mysql

  # ---------------------------------------------------------------
  # L2-c 不变量测试 —— 库存/幂等/退款/IDOR/启动断言
  # ---------------------------------------------------------------
  invariants:
    name: Invariants (业务不变量)
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: pip install -c constraints.txt -e ".[dev]"

      - name: 库存/幂等/退款/优惠券不变量
        run: pytest tests/invariants -q -m invariant

      - name: 启动断言（S1 结构性防御）
        run: pytest tests/invariants/test_startup_assertions.py -q

  # ---------------------------------------------------------------
  # L2-d 类型检查（标准档：basic）
  # ---------------------------------------------------------------
  typecheck:
    name: Typecheck (pyright basic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 准备类型检查环境（与本地命令完全一致）
        # pyproject.toml 里配了 venvPath="." / venv=".venv"，所以必须真的存在 .venv；
        # 同时必须装 [dev]——pyright 要解析 tests/ 里的 pytest / hypothesis 导入，
        # 只装 pydantic + sqlalchemy 会得到 22 处 reportMissingImports
        #（"环境没装"伪装成"类型错误"，真假问题混在一起）。
        run: |
          python -m venv .venv
          .venv/bin/pip install -c constraints.txt -e ".[dev]"

      - name: pyright（basic 档）
        # 用仓库自己的 pyright（pyproject [dev] 已声明版本），
        # 而不是第三方 action——保证"CI 跑的命令"与"本地跑的命令"逐字相同。
        run: .venv/bin/pyright

  # ---------------------------------------------------------------
  # L3 冒烟：仅 main 分支，起 compose 最小档跑关键链路
  #
  # 当前 0 业务代码，暂以占位实现（只验证 compose 可拉起）。
  # T1 起替换为真实链路：登录 → 下单 → 支付回调。
  # ---------------------------------------------------------------
  smoke:
    name: Smoke (compose 最小档)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [lint, contract, invariants]
    steps:
      - uses: actions/checkout@v4

      - name: 校验 compose 配置可解析
        run: docker compose -f deploy/docker-compose.yml config > /dev/null

      - name: 提示（待 T1 接入真实冒烟链路）
        run: |
          echo "::notice::当前为 T0 阶段（0 业务代码），冒烟仅校验 compose 配置。"
          echo "::notice::T1 完成后应替换为：拉起最小档 → 登录 → 下单 → 支付回调。"

  # ---------------------------------------------------------------
  # 门禁汇总（供分支保护规则引用）
  # ---------------------------------------------------------------
  gate:
    name: 门禁汇总
    if: always()
    needs: [docs, lint, contract, invariants, typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: 检查所有门禁任务
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          # 覆盖 failure/cancelled/timed_out/startup_failure：
          # 只匹配前两种会让"超时"与"启动失败"静默放行。
          if echo "$results" | grep -qE '"(failure|cancelled|timed_out|startup_failure)"'; then
            echo "::error::门禁未通过，禁止合并。"
            exit 1
          fi
          echo "✅ 全部门禁通过。"
