# =============================================================
# AIDS CI 门禁
#
# 设计见 docs/工程化门禁方案.md：
#   L1 pre-commit（本地，< 5s）—— 见 .pre-commit-config.yaml
#   L2 PR（本文件 docs / lint / contract / invariants / typecheck / images / frontend
#          / frontend-images，< 12min）
#   L3 merge 到 main（smoke：真拉起最小档 compose，< 15min）
#
# 核心思想：约束产出（代码能不能过检查），而非约束输入（AI 读没读文档）。
# =============================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------
  # L2-0 文档一致性门禁（TASKS DEP-05：必须是 CI 的**第一步**）
  #
  # 为什么排在 lint 之前：它拦的是"文档与代码已经互相矛盾"这类
  # 结构性漂移（表数/字段数/枚举组数/服务数/任务数/跨文档常量），
  # 一旦漂移，后面的测试即使全绿也没有意义。
  #
  # 纯标准库实现（argparse/re/pathlib），无需安装任何依赖——
  # 因此它不会因为依赖装不上而被跳过。历史教训：本脚本曾经**不在任何
  # 自动化里**，33 项检查只有在人记得手敲命令时才跑。
  # ---------------------------------------------------------------
  docs:
    name: Consistency (文档 35 项 + 依赖清单)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 文档一致性门禁
        run: python3 docs/tools/gen_data_dictionary.py --check -v

      - name: 依赖清单一致性（aids-*/requirements.txt ← pyproject.toml）
        run: python3 scripts/gen_requirements.py --check

      - name: 依赖快照一致性（constraints.txt 覆盖 pyproject 全部直接依赖）
        run: python3 scripts/gen_constraints.py --check

      - name: ORM 模型一致性（app/models ← docs/sql/schema.sql）
        # 纯标准库，与上面两条同属"单一来源 + 派生"的一致性门禁：
        # 模型是生成物，DDL 改了却忘了重跑生成器，症状是运行期 Unknown column。
        run: python3 scripts/gen_orm_models.py --check

  # ---------------------------------------------------------------
  # L2-a 代码风格与静态检查
  # ---------------------------------------------------------------
  lint:
    name: Lint (ruff + 扫描器)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        # 扫描器只用标准库（ast/re/pathlib），ruff 是唯一需要安装的——
        # 刻意保持"零项目依赖"，这样"装不上依赖"永远不是本 job 失败的原因。
        run: pip install -c constraints.txt "ruff>=0.8"

      - name: ruff format 检查
        # `app` 是共享契约层；`aids-*` 是服务包源码目录（aids-backend/aids_backend 等）；
        # `scripts/` 是四个生成器与环境自检脚本。
        # 曾经只写 `app tests`，BE-01 新增的服务代码完全不在检查范围内；
        # `scripts/` 同理长期只在 pre-commit（扫全仓）里被检查，于是出现
        # 「L1 红、L2 绿」的错位 —— 两侧扫描面必须一致才谈得上门禁。
        run: ruff format --check app tests aids-* scripts

      - name: ruff lint
        run: ruff check app tests aids-* scripts

      - name: C4 错误码扫描（禁止硬编码错误码）
        # 不传目录参数 = 使用 tests/contract/_targets.py 的默认扫描面
        # （共享层 + 全部服务包）。写死 `app` 会让新增服务静默漏检。
        run: python -m tests.contract.scan_error_codes

      - name: C2 状态枚举扫描（禁止魔法数字）
        run: python -m tests.contract.scan_enum_magic_numbers

  # ---------------------------------------------------------------
  # L2-b 契约测试 —— 本门禁的核心
  #
  # 必须跑在真实 MySQL 8 上：C1/C8 依赖 CHECK 约束、ngram 全文索引、
  # UNIQUE 语义，SQLite 测不出来。
  # ---------------------------------------------------------------
  contract:
    name: Contract (文档 ↔ 代码一致性)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aids_shop_test
          MYSQL_USER: aids
          MYSQL_PASSWORD: aids_pass
        ports:
          - 13306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --default-time-zone=+00:00

    env:
      APP_ENV: test
      DATABASE_URL: mysql+asyncmy://aids:aids_pass@127.0.0.1:13306/aids_shop_test?charset=utf8mb4

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        # 依赖清单只有 pyproject.toml 一处（含 pymysql —— 反射层测试要用它）。
        # 不在这里另写一份包名列表，避免"CI 装的和本地装的不一样"。
        run: pip install -c constraints.txt -e ".[dev]"

      - name: 载入 DDL（真实建表）
        # 为什么用 root 而不是应用账号 aids：
        #   schema.sql 含 CREATE DATABASE + USE，需要建库权限；服务容器的
        #   MYSQL_USER=aids 只被授予 MYSQL_DATABASE(aids_shop_test) 上的权限，
        #   建库直接 Access denied。用 root 执行，再把权限显式授给应用账号。
        #
        # 为什么用 sed 替换库名，而不是给 SQL 引入变量：
        #   schema.sql / seed.sql 里的库名是固定字面量 `aids_shop`。曾试过写成
        #   ${AIDS_MAIN_DB:-aids_shop}（像 shell 那样），实测 mysql 8.4.11 **不展开**：
        #   SHOW DATABASES 里出现字面名为 "${AIDS_MAIN_DB:-aids_shop}" 的库，38 张表
        #   全建了进去，且全程不报错。静默建错库比直接失败更难排查，故改回 sed。
        #   sed 只锚定反引号包裹的 `aids_shop`，不会误伤注释里出现的裸词 aids_shop。
        #
        # 为什么不能反过来"让 CI 也建 aids_shop"：
        #   启动断言 S1-d（app/core/config.py::assert_db_is_isolated）禁止 test 环境
        #   连库名含 aids_shop 的库；建得图省事，测试连的瞬间就被拒启。
        run: |
          set -euo pipefail

          # 1) 以 root 建库建表；库名 aids_shop -> aids_shop_test
          #    --default-character-set=utf8mb4：防止中文 COMMENT 在非 UTF8 连接下变问号
          sed 's/`aids_shop`/`aids_shop_test`/g' docs/sql/schema.sql \
            | mysql --default-character-set=utf8mb4 -h 127.0.0.1 -P 13306 -uroot -proot

          # 2) 授权给应用账号（否则后面用 aids 连接会 Access denied）
          mysql -h 127.0.0.1 -P 13306 -uroot -proot -e \
            "GRANT ALL PRIVILEGES ON \`aids_shop_test\`.* TO 'aids'@'%'; FLUSH PRIVILEGES;"

          # 3) 自检：表数必须为 38。这一步是"静默建错库"事故的直接产物——
          #    没有它，建到别的库上时后续测试会以"表不存在"的面目出现，误导排查方向。
          n=$(mysql -h 127.0.0.1 -P 13306 -uroot -proot -N -B -e \
            "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='aids_shop_test';")
          echo "aids_shop_test 表数 = $n"
          if [ "$n" != "38" ]; then
            echo "::error::期望 38 张表，实际 $n —— DDL 未完整导入。"
            exit 1
          fi
        continue-on-error: false

      - name: Alembic 迁移基建可加载（不需要 DB）
        # 验证 alembic.ini / env.py / 模型导入链是通的 —— 这类问题只在
        # 真正跑迁移时才暴露，而那时通常已经在部署窗口里了。
        run: alembic -c aids-backend/alembic.ini heads

      - name: C1/C2/C4/C7/C8 契约测试（静态层）
        # 用 `tests` 而非 `tests/contract`：BE-01 起的接口层契约测试在
        # tests/api/，同样带 contract 标记。按标记筛选比按目录筛选更耐用——
        # 新增测试目录时不会被漏掉。
        run: pytest tests -q -m contract

      - name: C1 契约测试（反射层，连真实库）
        run: pytest tests -q -m requires_mysql

  # ---------------------------------------------------------------
  # L2-c 不变量测试 —— 库存/幂等/退款/IDOR/启动断言
  # ---------------------------------------------------------------
  invariants:
    name: Invariants (业务不变量)
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: pip install -c constraints.txt -e ".[dev]"

      - name: 库存/幂等/退款/优惠券不变量
        run: pytest tests/invariants -q -m invariant

      - name: 共享层组件单测（Redis 不可达的用例自动 skip）
        run: pytest tests/core -q -m unit

      - name: 启动断言（S1 结构性防御）
        run: pytest tests/invariants/test_startup_assertions.py -q

  # ---------------------------------------------------------------
  # L2-d 类型检查（标准档：basic）
  # ---------------------------------------------------------------
  typecheck:
    name: Typecheck (pyright basic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 准备类型检查环境（与本地命令完全一致）
        # pyproject.toml 里配了 venvPath="." / venv=".venv"，所以必须真的存在 .venv；
        # 同时必须装 [dev]——pyright 要解析 tests/ 里的 pytest / hypothesis 导入，
        # 只装 pydantic + sqlalchemy 会得到 22 处 reportMissingImports
        #（"环境没装"伪装成"类型错误"，真假问题混在一起）。
        run: |
          python -m venv .venv
          .venv/bin/pip install -c constraints.txt -e ".[dev]"

      - name: pyright（basic 档）
        # 用仓库自己的 pyright（pyproject [dev] 已声明版本），
        # 而不是第三方 action——保证"CI 跑的命令"与"本地跑的命令"逐字相同。
        run: .venv/bin/pyright

  # ---------------------------------------------------------------
  # L2-e 服务镜像构建 + 容器冒烟
  #
  # 为什么单列一个 job（真实事故）：
  #   三个服务镜像此前**从未端到端构建过**——compose 的 9 个服务全是中间件，
  #   不含 backend/ai/mock；smoke job 只跑 `docker compose config`；文档门禁
  #   只比对 Dockerfile 文本里的 EXPOSE 端口。于是「COPY 指向不存在的目录」
  #   「CMD 的模块名写错」「依赖装不上」都能长期潜伏，直到部署当天才炸。
  #
  # 这里做两件事：真的 `docker build`，再把容器跑起来打 `/health`。
  # 构建用矩阵并行，墙钟时间约等于单个镜像。
  # ---------------------------------------------------------------
  images:
    name: Images (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            dockerfile: deploy/app/backend.Dockerfile
            port: 8080
          - service: ai
            dockerfile: deploy/app/ai.Dockerfile
            port: 8000
          - service: mock
            dockerfile: deploy/app/mock.Dockerfile
            port: 8081
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像（构建上下文 = 仓库根，与本地命令逐字相同）
        run: docker build -f ${{ matrix.dockerfile }} -t aids/${{ matrix.service }}:ci .

      - name: 容器冒烟（探针必须在 60s 内返回 code=0）
        # 只 build 不 run 是不够的：CMD 的模块路径、gunicorn 与 uvicorn worker 的
        # 组合、探针路径只要有一处对不上，容器就是"能构建、起不来"。
        run: |
          set -euo pipefail
          docker run -d --name smoke-${{ matrix.service }} \
            -e APP_ENV=development \
            -p ${{ matrix.port }}:${{ matrix.port }} \
            aids/${{ matrix.service }}:ci
          for _ in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:${{ matrix.port }}/health" -o /tmp/body.json; then
              cat /tmp/body.json
              grep -q '"code":0' /tmp/body.json
              echo "${{ matrix.service }} 探针通过"
              exit 0
            fi
            sleep 2
          done
          echo "::error::${{ matrix.service }} 容器 60s 内未通过探针"
          docker logs smoke-${{ matrix.service }} || true
          exit 1

      - name: 失败时输出容器日志
        if: failure()
        run: docker logs smoke-${{ matrix.service }} || true

      - name: 清理容器
        if: always()
        run: docker rm -f smoke-${{ matrix.service }} || true

  # ---------------------------------------------------------------
  # L2-f 前端工程（FE-01 / FE-02）
  #
  # 为什么单列一个 job（与 images job 同理）：
  #   两个前端工程（aids-mall / aids-admin）是纯 TS/Vue 交付物 —— Python 侧三道门禁
  #   （ruff / pyright / pytest）照不到它们。tests/contract/test_frontend_scaffold.py
  #   只能断言「结构与源码不变量」（工程独立、依赖齐全、单飞刷新、401 重放），
  #   而**并发语义**必须由真实工具链跑 `vitest` 才算数（"同时 N 个 401 只刷新一次"
  #   这种不变量，静态看代码看不出对错）。故这里真的 install → lint → test → build。
  #
  # npm ci 依赖 package-lock.json（两个工程均已入库）——锁文件缺失会让本 job 直接红，
  # 而不是悄悄退回 npm install 装出一棵与本地不同的依赖树。
  # ---------------------------------------------------------------
  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: aids-mall
          - app: aids-admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: 安装依赖（按锁文件，本地/CI 依赖树一致）
        working-directory: ${{ matrix.app }}
        run: npm ci --no-audit --no-fund

      - name: Lint（ESLint 9 flat config）
        working-directory: ${{ matrix.app }}
        run: npm run lint

      - name: 格式检查（Prettier）
        working-directory: ${{ matrix.app }}
        run: npm run format:check

      - name: 单测（vitest：无感刷新单飞 + 并发排队）
        working-directory: ${{ matrix.app }}
        run: npm test

      - name: 类型检查 + 构建（vue-tsc + vite）
        working-directory: ${{ matrix.app }}
        run: npm run build

  # ---------------------------------------------------------------
  # L2-g 前端镜像（FE-01 / FE-02）—— 补上 images job 的缺口
  #
  # 为什么单列（而不是塞进上面的 images 矩阵）：
  #   两者的探针形状不同 —— 后端镜像探的是 `/health` 且要求 body 里 `code=0`，
  #   前端镜像探的是 Nginx 的 `/healthz` 且只认 200。塞进同一个矩阵会让探针步骤
  #   长出一串 if，读起来比多一个 job 更累。
  #
  # 覆盖的缺口（docs/HANDOFF.md §4.7 登记的遗留）：
  #   `deploy/app/frontend.Dockerfile` 是**参数复用**的模板（`--build-arg APP_DIR`），
  #   两个工程共用一份 —— 于是"参数传错 / 少传"这类错误在本地 `npm run build`
  #   里根本照不到，必须真的 build 一次镜像才能发现。
  # ---------------------------------------------------------------
  frontend-images:
    name: Frontend images (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: aids-mall
            name: mall
          - app: aids-admin
            name: admin
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像（构建上下文 = 仓库根，与本地命令逐字相同）
        run: >-
          docker build -f deploy/app/frontend.Dockerfile
          --build-arg APP_DIR=${{ matrix.app }}
          --build-arg APP_NAME=${{ matrix.name }}
          -t aids/frontend-${{ matrix.name }}:ci .

      - name: 容器冒烟（Nginx 的 /healthz 必须在 60s 内返回 200）
        run: |
          set -euo pipefail
          docker run -d --name smoke-fe-${{ matrix.name }} \
            -p 8080:80 aids/frontend-${{ matrix.name }}:ci
          for _ in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:8080/healthz" -o /tmp/fe.txt; then
              cat /tmp/fe.txt
              grep -q "ok" /tmp/fe.txt
              echo "${{ matrix.app }} 前端镜像探针通过"
              exit 0
            fi
            sleep 2
          done
          echo "::error::${{ matrix.app }} 前端镜像 60s 内未通过 /healthz 探针"
          docker logs smoke-fe-${{ matrix.name }} || true
          exit 1

      - name: 失败时输出容器日志
        if: failure()
        run: docker logs smoke-fe-${{ matrix.name }} || true

      - name: 清理容器
        if: always()
        run: docker rm -f smoke-fe-${{ matrix.name }} || true

  # ---------------------------------------------------------------
  # L3 冒烟：仅 main 分支，真拉起 compose 最小档
  #
  # 应用服务的端到端链路（登录 → 下单 → 支付回调）待 T3 补齐后替换；
  # 当前验证的是"中间件编排与数据库初始化真的可用"——这部分在 T0 只被
  # `docker compose config`（纯解析，不拉起）覆盖过。
  # ---------------------------------------------------------------
  smoke:
    name: Smoke (compose 最小档)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [lint, contract, invariants, images]
    steps:
      - uses: actions/checkout@v4

      - name: 校验 compose 配置可解析
        run: docker compose -f deploy/docker-compose.yml config > /dev/null

      - name: 拉起最小档（MySQL + Redis + Nginx）并等待 healthy
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait mysql redis nginx

      - name: Nginx 探针
        run: curl -sf http://127.0.0.1/healthz

      - name: 数据库初始化自检（必须 38 表）
        # 与 contract job 同一判据：mysql 客户端不展开 SQL 里的 ${VAR}，
        # 静默建错库比直接失败更难查，故用表数自检兜底。
        run: |
          set -euo pipefail
          n=$(docker exec aids-mysql mysql -uroot -paids_root_2026 -N -B -e \
            "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='aids_shop';")
          echo "aids_shop 表数 = $n"
          if [ "$n" != "38" ]; then
            echo "::error::期望 38 张表，实际 $n —— 数据库初始化未完整执行。"
            exit 1
          fi

      - name: 提示（待 T3 接入应用链路）
        run: |
          echo "::notice::当前冒烟覆盖：中间件编排 + 数据库初始化 + 三服务镜像构建与探针。"
          echo "::notice::T3 完成后应替换为：登录 → 下单 → 支付回调。"

      - name: 收尾
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v || true

  # ---------------------------------------------------------------
  # 门禁汇总（供分支保护规则引用）
  # ---------------------------------------------------------------
  gate:
    name: 门禁汇总
    if: always()
    needs: [docs, lint, contract, invariants, typecheck, images, frontend, frontend-images]
    runs-on: ubuntu-latest
    steps:
      - name: 检查所有门禁任务
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          # 覆盖 failure/cancelled/timed_out/startup_failure：
          # 只匹配前两种会让"超时"与"启动失败"静默放行。
          if echo "$results" | grep -qE '"(failure|cancelled|timed_out|startup_failure)"'; then
            echo "::error::门禁未通过，禁止合并。"
            exit 1
          fi
          echo "✅ 全部门禁通过。"
