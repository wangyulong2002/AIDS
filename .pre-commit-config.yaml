# =============================================================
# pre-commit —— CI 门禁 L1（本地，< 5s）
#
# 安装：pip install pre-commit && pre-commit install
# 全量跑：pre-commit run --all-files
#
# 设计原则（见 docs/工程化门禁方案.md）：
#   违规必须"当场可见"，不依赖开发者自觉。
# =============================================================
default_language_version:
  python: python3.11

repos:
  # ---- 基础卫生 ----
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
        exclude: \.md$
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # ---- S7：环境变量/密钥文件禁入 ----
  - repo: local
    hooks:
      - id: forbid-sensitive-files
        name: "S7 禁止提交 .env 与密钥文件"
        entry: bash scripts/hooks/forbid_sensitive_files.sh
        language: system
        files: '(^|/)\.env$|\.pem$|\.key$'
        exclude: '\.example$'

  # ---- 残留文件扫描（项目特有）----
      - id: forbid-temp-files
        name: "禁止提交临时/测试残留文件"
        entry: bash scripts/hooks/forbid_temp_files.sh
        language: system
        pass_filenames: true

  # ---- ruff：格式 + lint ----
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ---- 项目契约扫描器 ----
  - repo: local
    hooks:
      - id: error-code-scan
        name: "C4 错误码扫描（禁止硬编码，须用 app.core.errors）"
        entry: python -m tests.contract.scan_error_codes
        language: system
        files: ^app/.*\.py$
        pass_filenames: true

      - id: enum-magic-number-scan
        name: "C2 状态枚举扫描（禁止 status == 裸数字）"
        entry: python -m tests.contract.scan_enum_magic_numbers
        language: system
        files: ^app/.*\.py$
        pass_filenames: true

  # ---- 文档一致性门禁（TASKS DEP-05：CI 的第一步 + 一条 pre-commit 钩子）----
  - repo: local
    hooks:
      - id: docs-consistency
        name: "文档一致性门禁（表/字段/枚举/服务数/任务数/跨文档常量/旧技术栈残留）"
        # 纯标准库实现（只用 argparse/re/pathlib），因此不需要 venv 依赖，
        # 也不会因为环境切换而失效——这是它能当"第一道闸"的前提。
        entry: python3 docs/tools/gen_data_dictionary.py --check
        language: system
        pass_filenames: false
        # 改动这些路径时才跑（脚本扫描面即 docs/** + deploy/** + 根级清单）
        files: ^(docs/.*|deploy/.*|README\.md|pyproject\.toml|\.gitignore)$

      - id: requirements-sync
        name: "依赖清单一致性（aids-*/requirements.txt 必须由 pyproject.toml 生成）"
        # 依赖只有 pyproject.toml 一处来源；三份清单是派生物，
        # 手改任何一份都会在这里被拦下。
        entry: python3 scripts/gen_requirements.py --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|aids-[a-z]+/requirements\.txt|scripts/gen_requirements\.py)$
