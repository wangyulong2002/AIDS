# =============================================================
# pre-commit —— CI 门禁 L1（本地，< 5s）
#
# 安装：pip install pre-commit && pre-commit install
# 全量跑：pre-commit run --all-files
#
# 设计原则（见 docs/工程化门禁方案.md）：
#   违规必须"当场可见"，不依赖开发者自觉。
# =============================================================
default_language_version:
  python: python3.11

repos:
  # ---- 基础卫生 ----
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
        exclude: \.md$
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # ---- S7：环境变量/密钥文件禁入 ----
  - repo: local
    hooks:
      - id: forbid-sensitive-files
        name: "S7 禁止提交 .env 与密钥文件"
        entry: bash scripts/hooks/forbid_sensitive_files.sh
        language: system
        files: '(^|/)\.env$|\.pem$|\.key$'
        exclude: '\.example$'

  # ---- 残留文件扫描（项目特有）----
      - id: forbid-temp-files
        name: "禁止提交临时/测试残留文件"
        entry: bash scripts/hooks/forbid_temp_files.sh
        language: system
        pass_filenames: true

  # ---- ruff：格式 + lint ----
  #
  # ★ rev 必须与 constraints.txt 的 `ruff==` 锁保持一致 ★
  #   曾经 rev 停在 v0.8.4，而 constraints.txt 锁 0.16.x —— 于是同一个文件在
  #   pre-commit（v0.8.4）与 CI / 本地（0.16.x）被判成**两种格式**，来回互相改。
  #   分歧根因是**中文字符显示宽度**：两版算法不同，`assert <条件>, "<长中文消息>"`
  #   一边算得下、一边算不下（v0.8.4 按宽 1 计，v0.16.x 按宽 2 计）。
  #   症状极隐蔽：pre-commit 报 "Passed" 却已改写文件内容，随后 `task_runner verify`
  #   的 `ruff format --check` 立刻红，形成"改了又红、红了又改"的循环。
  #   constraints.txt 已锁 0.16.8（由 gen_constraints.py 从当前环境生成），
  #   本 rev 与其同步 —— **今后升级 ruff 必须同时改这两处**。
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ---- 项目契约扫描器 ----
  - repo: local
    hooks:
      - id: error-code-scan
        name: "C4 错误码扫描（禁止硬编码，须用 app.core.errors）"
        entry: python -m tests.contract.scan_error_codes
        language: system
        # 覆盖共享层 app/ 与服务包 aids-<svc>/aids_<svc>/。
        # 曾经只写 ^app/ —— 新增服务目录后，那些文件既不被 C4 扫也不被 C2 扫，
        # 而门禁照样全绿。
        files: ^(app|aids-[a-z]+)/.*\.py$
        pass_filenames: true

      - id: enum-magic-number-scan
        name: "C2 状态枚举扫描（禁止 status == 裸数字）"
        entry: python -m tests.contract.scan_enum_magic_numbers
        language: system
        files: ^(app|aids-[a-z]+)/.*\.py$
        pass_filenames: true

  # ---- 文档一致性门禁（TASKS DEP-05：CI 的第一步 + 一条 pre-commit 钩子）----
  - repo: local
    hooks:
      - id: docs-consistency
        name: "文档一致性门禁（表/字段/枚举/服务数/任务数/跨文档常量/旧技术栈残留）"
        # 纯标准库实现（只用 argparse/re/pathlib），因此不需要 venv 依赖，
        # 也不会因为环境切换而失效——这是它能当"第一道闸"的前提。
        # 解释器必须写 `python` 而不能写 `python3`：本仓库的开发机是 Windows，
        # `python3` 在 Windows 上不存在（实测钩子退出码 9009 → 提交被拦，
        # 此前 L1 的四个一致性门禁在本地从未真正跑过）；CI（ubuntu + setup-python）
        # 两个名字都有，故以 `python` 为准两边通吃。
        entry: python docs/tools/gen_data_dictionary.py --check
        language: system
        pass_filenames: false
        # 改动这些路径时才跑（脚本扫描面即 docs/** + deploy/** + 根级清单）
        files: ^(docs/.*|deploy/.*|README\.md|pyproject\.toml|\.gitignore)$

      - id: requirements-sync
        name: "依赖清单一致性（aids-*/requirements.txt 必须由 pyproject.toml 生成）"
        # 依赖只有 pyproject.toml 一处来源；三份清单是派生物，
        # 手改任何一份都会在这里被拦下。
        entry: python scripts/gen_requirements.py --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|aids-[a-z]+/requirements\.txt|scripts/gen_requirements\.py)$

      - id: constraints-check
        name: "依赖快照一致性（constraints.txt 须覆盖 pyproject 全部直接依赖）"
        # requirements.txt 管"装什么"（声明），constraints.txt 管"装哪个版本"（快照）。
        # 新增/升级依赖后忘记重跑 --write，会让 CI 与本地装到不同版本。
        entry: python scripts/gen_constraints.py --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|constraints\.txt|scripts/gen_constraints\.py)$

      - id: orm-model-sync
        name: "ORM 模型一致性（app/models 必须由 schema.sql 生成）"
        # 模型是生成物：DDL 改了却忘了重跑生成器，症状是运行期 Unknown column。
        # 注意本钩子只保证"文件 == 生成器输出"；"生成器解析对不对"由
        # tests/contract/test_orm_matches_schema.py 用独立解析器把关（两层缺一不可）。
        entry: python scripts/gen_orm_models.py --check
        language: system
        pass_filenames: false
        files: ^(docs/sql/schema\.sql|app/models/.*|scripts/gen_orm_models\.py)$
