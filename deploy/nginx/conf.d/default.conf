# =============================================================
# AIDS 开发环境 Nginx 配置 (DEP-03)
#
# 路由规则:
#   /api/ai/**  → FastAPI   (SSE 必须关闭 buffering；AI 侧路径含 /api/ai 前缀，不剥离)
#   /api/**     → FastAPI 主业务（剥离 /api 前缀后转发，见 location 内注释）
#   /healthz    → Nginx 自身健康检查
#   其余        → 前端静态资源 (try_files)
#
# 【开发环境】使用 HTTP；生产改为 HTTPS 并启用证书
# 【未落地的约束】443 无 server block（而 compose 已映射 443）—— 见 docs/项目设计报告.md §9.10
# =============================================================

upstream aids_backend {
    server host.docker.internal:8080;
    keepalive 32;
}

upstream aids_ai {
    server host.docker.internal:8000;
    keepalive 32;
}

# 【注意】log_format 只能在 http 上下文声明（conf.d/*.conf 已被 http{} 包含），
#         放进 server{} 会导致 `nginx -t` 报 "log_format directive is not allowed here"。
log_format aids_json escape=json
    '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"cost":$request_time,'
    '"trace_id":"$upstream_http_x_trace_id"}';

server {
    listen       80;
    server_name  localhost;

    client_max_body_size 20m;
    charset utf-8;

    # 访问日志带 traceId（由后端回传，未命中则记为 "-"）
    access_log /var/log/nginx/aids.access.log aids_json;

    # ---------- Nginx 自身健康检查（供 compose healthcheck 使用）----------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---------- AI 客服：SSE 流式 ----------
    # 【关键】SSE 若开启 proxy_buffering，前端会等到全部生成完才收到内容，
    #        首字延迟会从 1s 劣化到 10s+，必须关闭。
    location /api/ai/ {
        proxy_pass         http://aids_ai;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # SSE 三件套
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;      # 长对话可能持续数分钟
        proxy_send_timeout 300s;

        # 防止中间层压缩导致流式失效
        gzip off;
        add_header X-Accel-Buffering no;
    }

    # ---------- 主业务 ----------
    # 【前缀剥离】API.md §1.1：对外的完整路径是 /api/**（基础地址 = https://{host}/api），
    # 而后端路由挂在 /user、/auth 等无 /api 前缀下。rewrite 把 /api/ 剥掉再转发：
    #     前端 GET /api/user/profile   →   后端 /user/profile
    # 为什么不用 `proxy_pass http://aids_backend/;`（带 URI 的等价写法）：
    #     rewrite 把映射显式写在明面上，review 一眼可见；
    #     且 /api/ai/ 走更长的独立 location，不受本条影响。
    # 【教训】此前缺这一行：经网关访问全部 404，而 9 个中间件容器全 healthy、
    #         后端直连 /health 也正常 —— 缺口藏在"网关"这一层，两侧各自测试都测不到。
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         http://aids_backend;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # traceId 透传（若前端已带则不覆盖）
        proxy_set_header   X-Trace-Id        $http_x_trace_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # 把后端返回的 traceId 暴露给前端（跨域时需要）
        add_header Access-Control-Expose-Headers X-Trace-Id;
    }

    # ---------- MinIO 图片直读（开发环境走内网，生产应上 CDN）----------
    # 【注意】不能写死 proxy_pass http://minio:9000/ —— nginx 在启动时就解析上游域名，
    #         构建期 `nginx -t` 时 "minio" 尚不存在会直接失败；且 MinIO 重启换 IP 后需要 reload。
    #         改用变量 + Docker 内置 DNS(127.0.0.11) 把解析推迟到运行期。
    location /files/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $minio_upstream http://minio:9000;
        rewrite ^/files/(.*)$ /$1 break;      # 去掉 /files 前缀，映射到 S3 根路径
        proxy_pass $minio_upstream;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---------- 前端静态资源 ----------
    location / {
        root      /usr/share/nginx/html;
        index     index.html;
        try_files $uri $uri/ /index.html;      # SPA 路由回退

        location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # ---------- 基础安全头 ----------
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # 隐藏版本号
    server_tokens off;
}
