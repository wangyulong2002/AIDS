# =============================================================
# AIDS 开发环境 - 中间件编排 (DEP-01)
#
# 启动方式（profiles 分档，按需拉起）:
#   docker compose up -d mysql redis nginx   # 最小可用: MySQL + Redis + Nginx
#   docker compose up -d                     # 默认档: 上面 + Kafka + MinIO
#   docker compose --profile search up -d    # 默认档 + Milvus(向量库, 供 AI RAG)
#   docker compose --profile all up -d       # 全部
#
# 容器实际占用（v1.3 本机实测，**空载**：无应用连接、未压测）:
#   默认档 5 个常驻 ≈0.9GB     全量档 8 个常驻 ≈1.5GB
#
# 【重要】资源下限指**宿主可用内存**，含 Docker Desktop/WSL2 自身开销，故高于上面的容器占用:
#   最小档            ≥ 2GB 可用内存
#   默认档(不含 search) ≥ 3.5GB 可用内存（v1.3 移除 Nacos 后下调，与 README 分档表一致）
#   全量档 all         ≥ 6GB 可用内存（6GB 为下限, 8GB 舒适; 口径与 deploy/README.md 一致）
#
# 数据库初始化：已由 mysql 自建镜像内置（构建期 COPY 脚本），首次启动自动按
#   schema → mock_schema → seed 顺序执行，无需手动导入。日志出现
#   "✅ 数据库初始化全部完成" 即成功。详见 deploy/README.md。
# =============================================================

name: aids

services:
  # ===========================================================
  # 核心中间件（默认启动，无 profile 限制）
  # ===========================================================

  mysql:
    # 自建镜像：内置初始化脚本（构建期 COPY 替代 bind mount，规避 WSL2 挂载故障）
    build:
      context: ..
      dockerfile: deploy/mysql/Dockerfile
    image: aids/mysql-init:8.4
    container_name: aids-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-aids_root_2026}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00          # 与 PRD §5.4「时间 UTC 存储」对齐
      - --max_connections=500
      - --innodb_buffer_pool_size=512M
      - --slow_query_log=1
      - --long_query_time=1
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-aids_root_2026}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [aids-net]

  redis:
    image: redis:7.4-alpine
    container_name: aids-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass ${REDIS_PASSWORD:-aids_redis_2026}
      - --appendonly yes                    # AOF 持久化: 购物车/预扣库存不能丢
      - --appendfsync everysec
      - --maxmemory 512mb
      - --maxmemory-policy noeviction       # 预扣库存的 key 绝不能被淘汰
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-aids_redis_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [aids-net]

  nginx:
    # 自建镜像：内置配置与静态页（构建期 COPY 替代 bind mount）
    build:
      context: ..
      dockerfile: deploy/nginx/Dockerfile
    image: aids/nginx:1.27
    container_name: aids-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - nginx-logs:/var/log/nginx
    # Linux/WSL2 下 host.docker.internal 默认不可解析，需显式映射到宿主网关，
    # 否则 Nginx 无法反代到宿主机上运行的后端与 FastAPI
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mysql
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [aids-net]

  # ===========================================================
  # 默认档：Kafka / MinIO
  # ===========================================================

  kafka:
    image: apache/kafka:3.9.0
    container_name: aids-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # 单机开发：自动创建 topic，省去手工建
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
    ports:
      - "${KAFKA_PORT:-29092}:29092"        # 宿主机访问用 localhost:29092
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks: [aids-net]

  minio:
    # 【镜像源】MinIO 官方已把镜像迁到 quay.io；Docker Hub 的旧日期标签被下架，
    #          经国内镜像加速器（daocloud）访问会返回 403。统一改用 quay.io。
    image: quay.io/minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: aids-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-aids_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-aids_minio_2026}
    ports:
      - "${MINIO_PORT:-9000}:9000"          # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"  # 控制台
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [aids-net]

  # 创建业务所需的 bucket（一次性任务，跑完退出）
  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: aids-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set aids http://minio:9000 ${MINIO_USER:-aids_minio} ${MINIO_PASSWORD:-aids_minio_2026} &&
      mc mb --ignore-existing aids/aids-product &&
      mc mb --ignore-existing aids/aids-review &&
      mc mb --ignore-existing aids/aids-refund &&
      mc mb --ignore-existing aids/aids-kb &&
      mc anonymous set download aids/aids-product &&
      mc anonymous set download aids/aids-review &&
      echo '✅ MinIO buckets ready'
      "
    networks: [aids-net]

  # ===========================================================
  # search profile：向量库 Milvus（供 AI RAG 知识库检索）
  #
  # 【v1.2 重要变更】商品搜索已改用 MySQL 8 全文索引（PRD §5.6），
  # 不再需要 Elasticsearch —— 该 profile 现仅含 Milvus 三件套
  # (milvus-etcd + milvus-minio + milvus)。
  # 内存占用大头，默认不启动；需要 AI 知识库功能时再加：
  #   docker compose --profile search up -d
  # ===========================================================


  # Milvus standalone 依赖 etcd(元数据) + MinIO(向量段存储)
  # 注意: Milvus 自带一套 MinIO 依赖，与业务 MinIO 是**独立实例**（端口不同），避免数据混淆
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: aids-milvus-etcd
    profiles: [search, all]
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd -advertise-client-urls=http://127.0.0.1:2379
           -listen-client-urls=http://0.0.0.0:2379
           --data-dir /etcd
    volumes:
      - milvus-etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks: [aids-net]

  milvus-minio:
    image: quay.io/minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: aids-milvus-minio
    profiles: [search, all]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data --console-address ":9101"
    ports:
      - "${MILVUS_MINIO_PORT:-9100}:9000"
    volumes:
      - milvus-minio-data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks: [aids-net]

  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: aids-milvus
    profiles: [search, all]
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
      COMMON_STORAGETYPE: minio
    ports:
      - "${MILVUS_PORT:-19530}:19530"       # gRPC
      - "${MILVUS_WEB_PORT:-9091}:9091"     # metrics/health
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks: [aids-net]

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  minio-data:
  milvus-etcd-data:
  milvus-minio-data:
  milvus-data:
  nginx-logs:

networks:
  aids-net:
    driver: bridge
