# =============================================================
# Alembic configuration -- main database (aids_shop) migration chain
#
# Usage (run from the repository root):
#   alembic -c aids-backend/alembic.ini heads
#   alembic -c aids-backend/alembic.ini revision --autogenerate -m "message"
#   alembic -c aids-backend/alembic.ini upgrade head
#   alembic -c aids-backend/alembic.ini downgrade -1
#
# DATABASE_URL is read from the ENVIRONMENT by env.py (same source as the
# running application). The `sqlalchemy.url` below is a PLACEHOLDER only, so
# that alembic does not fail to start when the variable is absent.
#
# ---- THIS FILE MUST STAY ASCII-ONLY (do not add non-ASCII text) ----
# Alembic loads it via `configparser.read(..., encoding="locale")`, i.e.
# locale.getencoding(). On a Chinese Windows that is cp936 (GBK) rather than
# utf-8, so any UTF-8 CJK character here raises:
#     UnicodeDecodeError: 'gbk' codec can't decode byte 0x80
# and PYTHONUTF8=1 does NOT help -- it only changes getpreferredencoding(),
# not getencoding(). Chinese documentation lives in
# `aids-backend/alembic/README.md` instead.
# -------------------------------------------------------------------
#
# STATUS: T0 / BE-02 ships the scaffolding only. `docs/sql/schema.sql` is still
# the authoritative source of DDL (docs/TASKS.md DEP-04 records "Alembic
# adoption deferred to T1"), so versions/ is intentionally empty.
# =============================================================

[alembic]
script_location = %(here)s/alembic

# Let env.py import `app.*` (app/ lives at the repository root).
prepend_sys_path = %(here)s/..

# Date-time prefix: lexical order == chronological order, so `ls versions/`
# reads as an evolution timeline.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Placeholder -- the real value is injected by env.py from the environment.
sqlalchemy.url = mysql+pymysql://aids:aids_pass@127.0.0.1:13306/aids_shop?charset=utf8mb4

[post_write_hooks]
# Intentionally empty: generated revisions follow script.py.mako's style and
# are not rewritten by extra tooling afterwards.

# ---------------------------------------------------------------------
# Logging (read by env.py via fileConfig; omitting it makes alembic abort)
# ---------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
