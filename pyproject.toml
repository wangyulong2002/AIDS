[project]
name = "aids"
version = "0.1.0"
description = "AIDS 企业级电商平台 + AI 智能客服"
requires-python = ">=3.11"
dependencies = [
    # 上界不是洁癖：fastapi 0.14x 把 include_router 的结果改成惰性 _IncludedRouter，
    # 让两处依赖 `app.routes` 结构的契约测试集体假阴性（CI 每次装最新版，说红就红）。
    # 抬上界前请先跑 `pytest tests -q`。
    "fastapi>=0.115,<0.142",
    "uvicorn[standard]>=0.32",
    # gunicorn + uvicorn worker：deploy/app/*.Dockerfile 的 CMD 依赖它。
    # 曾经"CMD 里用了、依赖里没声明"——镜像能起来，运行时 executable not found。
    "gunicorn>=23.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncmy>=0.2.9",
    "redis>=5.2",
    "aiokafka>=0.12",
    "pyjwt[crypto]>=2.10",
    "cryptography>=44.0",
    # 密码哈希（替代 passlib，见 docs/项目设计报告.md 附录 A）
    "bcrypt>=4.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.120",
    # 反射层契约测试（C1 requires_mysql）用 tests/conftest.py 的
    # _to_sync_url() 把 mysql+asyncmy:// 转成 mysql+pymysql://。
    # 曾经只在 CI 里单独 pip install——本地按 README 装完仍连不上库。
    "pymysql>=1.1",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------
# pytest —— tests/contract 与 tests/invariants 是 CI 门禁核心
# ---------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# pytest-asyncio：测试里直接写 `async def test_xxx` 即视为异步用例，
# 不必逐个加 @pytest.mark.asyncio。ORM 基建（BE-02）起 async 测试成为常态。
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# 服务包 aids_backend / aids_ai / aids_mock 位于 aids-*/ 下（目录名带连字符，
# 不是合法模块名），因此不在仓库根，也不在 site-packages。显式加进来，测试里才能
# `from aids_backend.app_factory import create_app`。
# 共享层 app/ 在仓库根，已由 rootdir 自动入 path，无需声明。
# 新增服务时**必须在此追加**，否则该服务在测试里 import 不到；
# tests/contract/test_service_skeletons.py 会断言「磁盘上的服务包都在 pythonpath 内」。
pythonpath = ["aids-backend", "aids-ai", "aids-mock"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "contract: 文档 ↔ 代码 一致性测试（CI 必过，门禁核心）",
    "invariant: 业务不变量测试（CI 必过）",
    "requires_mysql: 需要真实 MySQL 8 实例（CI 提供 services）",
    "slow: 慢测试",
    # 任务验收标记：@pytest.mark.task("BE-11")
    # 用途见 tests/contract/test_task_coverage.py —— TASKS.md 里被勾成 ✅ 的任务，
    # 必须至少有一个带该标记的测试。没有它，「任务已完成」就只是文档里的一句话。
    "task: 该测试覆盖 docs/TASKS.md 中某个具体任务的验收标准",
    # 纯组件单测（tests/core/）：不依赖数据库；依赖 Redis 的用例在不可达时自动 skip
    "unit: 共享层组件单元测试（tests/core/，CI 的 invariants job 一并执行）",
]

# ---------------------------------------------------------------------
# ruff —— 格式与静态检查
# ---------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
# app/models/ 是**生成物**（由 scripts/gen_orm_models.py 从 docs/sql/schema.sql 派生），
# 不参与 ruff 格式化与检查：格式化会改写文件，而 `gen_orm_models.py --check`
# 正是靠"文件内容 == 生成结果"来保证模型与 DDL 不漂移 —— 两者必须二选一。
# 类型正确性仍由 pyright 把关（pyright 的 include 含 app/）。
#
# aids-backend/alembic/versions/ 同理：文件由 `alembic revision --autogenerate` 生成，
# 其缩进/引号风格由 Alembic 自己的渲染器决定，ruff format 每次都会要求重排 ——
# 于是"每生成一条迁移就要先格式化再提交"，纯噪音。经 pre-commit 时还得靠 --force-exclude，
# 因为 ruff-format 钩子的 entry 就是 `ruff format --force-exclude`。
# 类型仍由 pyright 覆盖；模板层的问题（如生成物带行尾空格）在 script.py.mako 里根治。
exclude = ["deploy", "docs", ".trae", "app/models", "aids-backend/alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # 行长度由 formatter 处理
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.lint.isort]
# 为什么要显式声明：ruff 自动识别"第一方包"靠的是**目录名与模块名一致**，
# 而服务目录是 `aids-backend`（连字符）→ 模块名 `aids_backend` 匹配不上，
# 会被归入第三方组，import 顺序与 app.* 分家（I001）。
# 显式列出后：stdlib | 第三方 | 第一方(app / aids_* / tests)，语义清晰。
known-first-party = ["app", "aids_backend", "aids_ai", "aids_mock", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------
# pyright —— 类型检查（标准档：basic）
# ---------------------------------------------------------------------
[tool.pyright]
include = ["app", "tests", "aids-backend/aids_backend", "aids-ai/aids_ai", "aids-mock/aids_mock"]
exclude = ["**/node_modules", "deploy", "docs"]
# aids_* 不在 site-packages：它们是源码目录 aids-*/ 下的包，
# 需显式加入解析路径，否则整个服务层都是 reportMissingImports。
# CI 的 typecheck job 动态生成 pyrightconfig.json，同样要带上这些路径。
extraPaths = ["aids-backend", "aids-ai", "aids-mock"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
# 类型检查必须用仓库自己的 venv：tests/ 里 import pytest / hypothesis，
# 若 pyright 解析到系统解释器（没装这些包）会报 22 处 reportMissingImports
# ——"类型检查失败"变成"环境没配好"，真假问题混在一起。
venvPath = "."
venv = ".venv"
